steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - cloud/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: visionaid
  _IMAGE: visionaid-rfdetr
timeout: 1800s
